<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 진주외고 부장회의</title><link rel="stylesheet" href="style.css"><body>
<header><div class="brand">JINJU FOREIGN LANGUAGE HIGH SCHOOL</div><div class="header-meta">LEADERSHIP MEETING · 2026</div><h1>2026 진주외고 부장회의</h1><p>함께 준비하고, 명확하게 공유하는 진주외고의 한 주.</p></header>
<main><section class="toolbar"><label>회의일자 <input id="date" type="date"></label><button id="print">인쇄 / PDF 저장</button><button id="export">자료 내려받기</button><span>공통번호로 수정</span></section><div class="schedule-note">매주 월요일 부장회의 · 수요일 00:00부터 다음 주 회의 자료를 준비합니다.</div><aside id="notice" role="status">연결 준비 중…</aside><section class="summary"><h2 id="heading">회의자료</h2><span id="progress"></span></section><div class="table-wrap"><table><thead><tr><th>부서</th><th>전달사항</th><th>입력 상황</th></tr></thead><tbody id="rows"></tbody></table></div><footer><span class="footer-brand">진주외국어고등학교 · JINJU FLHS</span><span>부서별 자료를 저장한 후 완료 상태를 확인해 주세요.</span></footer></main>
<dialog id="editor"><form id="editform"><div class="dialog-kicker">DEPARTMENT BRIEFING</div><h2 id="editTitle"></h2><label>수정 비밀번호<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="공통번호 4자리" required></label><label>전달사항<textarea id="content" rows="12" maxlength="20000" placeholder="1. 주요 업무 및 일정&#10;2. 협조 요청 사항&#10;3. 준비물 및 마감"></textarea></label><label>입력 상황<select id="state"><option>수정 중</option><option>완료</option></select></label><p id="saveMessage" role="status"></p><div class="actions"><button type="button" id="cancel">닫기</button><button class="primary" id="save">저장</button></div></form></dialog>
<script src="config.js"></script><script type="module" src="app.js"></script></body></html>
